# Risk
Demand uncertainty: true
Gas price uncertainty: true
Weather uncertainty: false
Risk aversion flag: false
Risk aversion weight: 0.5
Value-at-Risk percent: 0.05
Risk sharing flag: false

# Policy instruments
Price cap: 2000
Investment tax credits flag: false
Production tax credits flag: false
Standard flag: false
Carbon cap flag: false
Carbon tax flag: false
# Policy parameters
# Investment tax credits
Endogenous tax credits flag: false
Tax credits: [0, 0, 0, 0, 0]
# Production tax credit
Production credits: [0, 0, 0, 0]
# CES
Standard mandate: 0.80
# Carbon tax 
Carbon tax: 0
# Cap and trade
Carbon cap: 25000
Contracts: false
Search equilibria: false
CRM flag: true

Scaling factor cost: 1e5
Scaling factor demand: 1
Convergence tolerance: 1e-3

Cost of nonserved energy: [9e3,1500,1100,400]
Max nse: [0.917,0.05,0.03,0.003]

Regularization flag: true
Regularization strategy: "Level Set" # options are "QTR" and "Level Set"

# Distributed Memory Parallelization
Parallel flag: true
Workers: 64
Memory debug flag: false

Seed: 1234

Budget convergence tolerance: 1e-3

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Settings groups for run_stochastic_exploration_risk_pareto (experiments/mga/run_settings.jl).
# These are the base values; a run overrides individual keys with the driver's keyword of the
# same name (budget_settings = Dict(...), cut_settings = Dict(...), ...). Unknown keys error.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

Run settings: # MGA vectors, output naming, evaluation SPs and diagnostics
  MGA vectors: 50 # number of MGA directions explored after the risk-weight anchors
  Vector type: "random" # how directions are drawn: "random" or "min/max"
  Capacity exploration: true # false: anchors only, no MGA vectors
  Summary name: "new_setup" # Summary_<name>.csv
  Vector set: null # runtime only: explicit list of directions (null -> generate from Vector type)
  Eval SPs: null # runtime only: evaluation subproblems to score each final solve on
  Run log: null # runtime only: Vector to collect per-run diagnostics (see log_run!)

Budget settings: # budget constraint used during capacity exploration, and its tightening schedule
  Budget type: "Transformed" # "Transformed" or "Box"
  Budget offset: 1.0 # Transformed: added to the loosest budget
  Budget multiplier: 1.10 # Box: scales the EV-optimal System Expected cost
  Tighten budget: false # Transformed only: step the budget down per MGA vector
  Tighten step size: 0.1
  Floor offset: 0.01 # tightest budget = min transformed anchor cost + this

Cap settings: # extra caps on one metric (System Expected / CVaR) at selected tightening levels
  Cap wings: true # only active when tightening a Transformed budget
  Number of caps: 2 # max caps per wing per level
  Cap levels: [1] # tightening levels at which caps are run

Mapping settings: # records every Benders iterate within the gap threshold (Summary rows <label>_iter_<k>)
  Mapping: false
  Mapping gap threshold: 0.2 # iterates with gap at or below this are recorded / kept by the Delaunay filter

Sampling settings: # portfolios evaluated after exploration, labelled by subproblem solves only. The RNG seed is Seed above.
  Method: "None" # "None", "Delaunay" (cost-space simplices), "Boundary" (region blends) or "GridFill" (cost-space gap filling)
  Samples: 3000 # portfolios to evaluate (GridFill: upper limit; it stops early once no empty cell is left)
  Batch size: 64 # Boundary / GridFill: solves per select -> evaluate round; solved points feed the next round
  Candidates: 30 # Boundary: candidate pool per pick; GridFill: candidates kept per cell
  Write gradients: false # Boundary / GridFill: also write per-solve Gradients.csv files to disk
  Delaunay: # sample_interior_delauney / sample_interior_distributed
    Interior sample method: "CVT" # "Base", "CVT", "Random" or "HitAndRun"
    Simplex fraction: 0.1 # share of simplices sampled per round
    Repeat mode: "ProgressiveRefinement" # "CycleSampling" or "ProgressiveRefinement"
  Boundary: # src/model/boundary_sampling/boundary_sampler.jl. Blends of neighbouring final solves just inside the
    # hull boundary, spread out by greedy max-min distance in a metric built from the Benders capacity gradients.
    Quotas: [[outer_shell, 0.50], [ev_wing, 0.15], [cvar_wing, 0.15], [interior, 0.20]] # base-region shares, in selection order
    K neighbours: 6 # neighbours a base vertex can blend with
    Base weight range: [0.5, 0.85] # weight kept on the base vertex
    Metric: "active_subspace" # "active_subspace" or "lengthscale_file"
    Metric file: null # length-scale CSV (tech, cap_max_MW, length_scale); only read for "lengthscale_file"
    Energy share: 0.999 # keep the fewest eigen-directions reaching this share (0.95 kept r = 1 on run 13 and over-spread the picks)
    r max: 50 # ... but at most this many
    Explicit M max dim: 200 # d above this: thin SVD instead of forming the d x d matrix
    Refit metric each wave: false # rebuild the subspace with the interior gradients included
  GridFill: # src/model/boundary_sampling/gridfill_*.jl. Grid over (c_hat, v_hat) = anchor-normalised (Inv + EV, Inv + CVaR);
    # each empty cell is targeted with barycentric blends of three solved points, aimed with the cut bracket midpoint.
    Cell size: 0.025 # cell edge in (c_hat, v_hat)
    Delta cap: 1.1 # only cells with c_hat + v_hat at or below this (the near-optimal region)
    Per cell: "auto" # samples per cell: an integer cap, or "auto" to fill in layers (1 per reachable cell, then 2, ...) until Samples is spent

Cut settings: # cut pool, see src/model/benders/cut_pool.jl
  Cuts retained: 500000 # memory cap on live + archived cuts, applied at each new risk weight / MGA vector
  Trim rule: "recent_binding" # which cuts survive "Cuts retained": "recent_binding" or "earliest"
  Prune window: {Anchor: 8, Budget: 2, EV cap: 2, CVaR cap: 3} # iterations without binding before a live cut is archived, per solve type
  Binding tolerance: 1.0e-6 # a cut whose MP dual is at least this counts as binding
  Separation tolerance: 1.0e-6 # relative violation (over max(1,|rhs|)) at which an archived cut is restored
  Cuts per round: 500 # most-violated archived cuts restored per separation round
  Max rounds: 5 # separation rounds per MP solve before the sub-problems run
